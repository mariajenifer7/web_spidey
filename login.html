<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">

<head>

<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<title>Web Spidey</title>

<style>

body{
    margin:0;
    font-family:Georgia;
    background:linear-gradient(to bottom,#f8f4ef,#efe5d8);
    color:#222;
}

/* =========================
        SPIDER-MAN HEADER
========================= */

.header{
    position:relative;
    background-color:#000;
    text-align:center;
    padding:30px 20px;
    overflow:hidden;
    border-bottom:3px solid red;
}

/* =========================
        WEB EFFECT
========================= */

.header::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:

    repeating-linear-gradient(
        45deg,
        transparent 0px,
        transparent 60px,
        rgba(255,0,0,0.15) 62px,
        transparent 64px
    ),

    repeating-linear-gradient(
        -45deg,
        transparent 0px,
        transparent 60px,
        rgba(255,0,0,0.15) 62px,
        transparent 64px
    );

    z-index:0;
}

/* =========================
            LOGO
========================= */

.logo{
    width:80px;
    height:80px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid red;
    box-shadow:0 0 15px red;
    position:relative;
    z-index:1;
    margin-bottom:15px;
}

/* =========================
            TITLE
========================= */

.header h1{
    position:relative;
    z-index:1;
    margin:0;
    font-size:55px;
    color:white;
    letter-spacing:4px;
    text-shadow:0 0 12px red;
}

/* =========================
          SUBTITLE
========================= */

.header p{
    position:relative;
    z-index:1;
    margin-top:10px;
    font-size:22px;
    color:#f5d6d6;
}

/* =========================
          NAVIGATION
========================= */

.navbar{
    background:rgba(20,20,20,0.95);
    padding:18px;
    text-align:center;
    box-shadow:0px 2px 10px rgba(0,0,0,0.2);
}

.navbar a{
    color:white;
    text-decoration:none;
    margin:18px;
    font-size:18px;
    transition:0.3s;
}

.navbar a:hover{
    color:#d4b483;
}

/* =========================
          LOGIN BOX
========================= */

.login-container{
    width:320px;
    margin:60px auto;

    /* Peach shadow OUTSIDE the box */
    box-shadow:
    0px 12px 35px rgba(255,170,120,0.6),
    0px 0px 60px rgba(255,140,90,0.4);

    border-radius:20px;
}

.login-box{
    background:white;
    padding:30px;
    border-radius:20px;
}

.login-box h2{
    text-align:center;
    margin-top:0;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:8px;
    font-family:Georgia;
    box-sizing:border-box;
}

.login-btn{
    width:100%;
    padding:12px;
    background:black;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
    font-family:Georgia;
}

.login-btn:hover{
    background:#d4b483;
    color:black;
}

.back-home{
    text-align:center;
    margin-top:15px;
}

.back-home a{
    text-decoration:none;
    color:#444;
}

/* =========================
            FOOTER
========================= */

.footer{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:60px;
}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

    <img src="logo.jpeg.jpeg"
    alt="Web Spidey Logo"
    class="logo" />

    <h1>WEB SPIDEY</h1>

    <p>Log In To Your Account</p>

</div>

<!-- NAVBAR -->

<div class="navbar">

    <a href="home1.html">Home</a>
    <a href="categories.html">Categories</a>
    <a href="popular.html">Popular</a>
    <a href="register.html">Register</a>
    <a href="login.html">Login</a>
    <a href="logout.html">Logout</a>

</div>

<!-- LOGIN FORM -->

<div class="login-container">

    <div class="login-box">

        <h2>Login</h2>

        <form action="home.html">

            <label>Username</label>
            <input type="text" required />

            <label>Password</label>
            <input type="password" required />

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="back-home">
            <a href="home1.html">Back to Home</a>
        </div>

    </div>

</div>

<!-- FOOTER -->

<div class="footer">

    <p>
        © 2026 Web Spidey | All Rights Reserved
    </p>

</div>

</body>
</html>
