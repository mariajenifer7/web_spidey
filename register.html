<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Register - Web Spidey</title>
<style>

/* =========================
            BODY
========================= */

body{
    margin:0;
    font-family:Georgia;
    color:#222;

    /* Peach glowing background */
    background:
    radial-gradient(circle at top left, rgba(255,170,120,0.45), transparent 35%),
    radial-gradient(circle at top right, rgba(255,190,150,0.35), transparent 35%),
    radial-gradient(circle at bottom, rgba(255,140,90,0.40), transparent 40%),
    linear-gradient(to bottom,#f8f4ef,#efe5d8);

    min-height:100vh;
}

/* =========================
        REGISTER BOX
========================= */

.register-box{
    width:320px;
    margin:50px auto;
    background:white;
    padding:25px;
    border-radius:20px;

    /* Peach shadow outside the box */
    box-shadow:
    0px 12px 35px rgba(255,170,120,0.6),
    0px 0px 60px rgba(255,140,90,0.4);
}

/* =========================
        SPIDER-MAN HEADER
========================= */

.header{
    position: relative;
    background-color: #000;
    text-align: center;
    padding: 30px 20px;
    overflow: hidden;
    border-bottom: 3px solid red;
}

/* =========================
        WEB EFFECT
========================= */

.header::before{
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background:
    
    repeating-linear-gradient(
        45deg,
        transparent 0px,
        transparent 60px,
        rgba(255,0,0,0.15) 62px,
        transparent 64px
    ),

    repeating-linear-gradient(
        -45deg,
        transparent 0px,
        transparent 60px,
        rgba(255,0,0,0.15) 62px,
        transparent 64px
    );

    z-index: 0;
}

/* =========================
            LOGO
========================= */

.logo{
    width: 80px;
    height: 80px;

    border-radius: 50%;
    object-fit: cover;

    border: 2px solid red;

    box-shadow: 0 0 15px red;

    position: relative;
    z-index: 1;

    margin-bottom: 15px;
}

/* =========================
            TITLE
========================= */

.header h1{
    position: relative;
    z-index: 1;

    margin: 0;

    font-size: 55px;
    color: white;

    letter-spacing: 4px;

    text-shadow: 0 0 12px red;
}

/* =========================
          SUBTITLE
========================= */

.header p{
    position: relative;
    z-index: 1;

    margin-top: 10px;

    font-size: 22px;

    color: #f5d6d6;
}
/* NAVIGATION */

.navbar{
background:rgba(20,20,20,0.95);
padding:18px;
text-align:center;
box-shadow:0px 2px 10px rgba(0,0,0,0.2);
}

.navbar a{
color:white;
text-decoration:none;
margin:18px;
font-size:18px;
transition:0.3s;
}

.navbar a:hover{
color:#d4b483;
}
/* BUTTON */

.main-btn{
padding:15px 35px;
background:#1f1f1f;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
transition:0.3s;
font-family:Georgia;
}

.main-btn:hover{
background:#d4b483;
color:black;
}
/* FOOTER */

.footer{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:60px;
}
</style>
</head>


<body style="font-family: Georgia; background-color: #f4f4f4; margin: 0;">

   <!-- HEADER -->
<div class="header">

    <img src="logo.jpeg.jpeg"
    alt="Web Spidey Logo"
    class="logo">

      <h1>WEB SPIDEY</h1>

    <p>Create Your Account</p>

</div>

       
    </div>

</div>

<div class="navbar">

<a href="home1.html">Home</a>
<a href="register.html">Register</a>
<a href="login.html">Login</a>
<a href="logout.html">Logout</a>
</div>
    <!-- Register Form -->
    

<div class="register-box">
        <h2 style="text-align: center;">Register</h2>

        <form action="login.html">
            <label>Username</label><br>
            <input type="text" required style="width: 100%; padding: 8px;"><br><br>

            <label>Email</label><br>
            <input type="email" required style="width: 100%; padding: 8px;"><br><br>

            <label>Password</label><br>
            <input type="password" required style="width: 100%; padding: 8px;"><br><br>

            <label>Confirm Password</label><br>
            <input type="password" required style="width: 100%; padding: 8px;"><br><br>

            <button type="submit" style="width: 100%; padding: 10px; background: black; color: white; border: none;">
                Register
            </button>
        </form>

        <p style="text-align: center; margin-top: 10px;">
            Already have an account? <a href="login.html">Login</a>
        </p>

    </div>
<!-- FOOTER -->

<div class="footer">

<p>
© 2026 Web Spidey | All Rights Reserved
</p>

</div>

</body>
</html>
